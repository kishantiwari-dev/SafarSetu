spring:
  application:
    name: safarsetu-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    connection-timeout: 10s
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
safarsetu:
  eta:
    average-speed-kmh: ${ETA_AVERAGE_SPEED_KMH:25}
    route-distance-factor: ${ETA_ROUTE_DISTANCE_FACTOR:1.3}
  freshness:
    location-stale-after: ${LOCATION_STALE_AFTER:PT15M}
    occupancy-stale-after: ${OCCUPANCY_STALE_AFTER:PT30M}
  crowding:
    moderate-percent: ${CROWDING_MODERATE_PERCENT:40}
    high-percent: ${CROWDING_HIGH_PERCENT:70}
    nearly-full-percent: ${CROWDING_NEARLY_FULL_PERCENT:90}
  seed:
    enabled: false
